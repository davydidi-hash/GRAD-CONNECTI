<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="chart-title chart-desc">
  <!-- Maroon-toned chart of published UBOS 2024 indicators. -->
  <title id="chart-title">UBOS 2024 published indicators</title>
  <desc id="chart-desc">National unemployment, youth NEET and Kampala indicators from the 2024 census reports.</desc>
  <rect width="720" height="240" fill="#fbf7f7"/>
  <text x="24" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#7b1e2d">UBOS 2024 published indicators</text>
  <line x1="24" y1="46" x2="696" y2="46" stroke="#e6d8db" stroke-width="1"/>
  <g font-family="Calibri, Arial, sans-serif" font-size="13" fill="#2a2225">
    <text x="24" y="84">National unemployment (15+)</text>
    <rect x="290" y="68" width="93" height="20" rx="5" fill="#7b1e2d"/>
    <text x="396" y="84" font-weight="700" fill="#7b1e2d">12.3%</text>
    <text x="24" y="124">Youth NEET (15–24) · 4,001,528</text>
    <rect x="290" y="108" width="324" height="20" rx="5" fill="#a8384a"/>
    <text x="627" y="124" font-weight="700" fill="#7b1e2d">42.6%</text>
    <text x="24" y="164">Kampala unemployed · 87,468</text>
    <rect x="290" y="148" width="101" height="20" rx="5" fill="#7b1e2d"/>
    <text x="404" y="164" font-weight="700" fill="#7b1e2d">13.3%</text>
    <text x="24" y="204">Kampala NEET (15–24)</text>
    <rect x="290" y="188" width="242" height="20" rx="5" fill="#a8384a"/>
    <text x="545" y="204" font-weight="700" fill="#7b1e2d">31.9%</text>
  </g>
  <text x="24" y="230" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#6b5e61">Source: UBOS 2024 census reports.</text>
</svg>
